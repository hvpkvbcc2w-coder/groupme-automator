name: GroupMe Auto Poster

on:
  schedule:
    # Triggers every 5 minutes to maintain the loop
    - cron: '*/5 * * * *'
  workflow_dispatch: # For manual testing

jobs:
  post-message:
    runs-on: ubuntu-latest
    steps:
      - name: Run 30 Second Message Loop
        run: |
          for i in {1..10}
          do
            echo "Sending message $i..."
            # FIXED: Targets the main group and routes directly into the sub-topic ID path
            curl -X POST "https://groupme.com" \
            -H "Content-Type: application/json" \
            -d "{\"message\": {\"text\": \"!fih\", \"source_guid\": \"$(uuidgen)\"}}"
            
            echo "Waiting 30 seconds..."
            sleep 30
          done
